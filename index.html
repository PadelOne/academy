<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padel One Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#A07830;
  --beige:#FAF6EE;--beige-dark:#F0E8D4;
  --dark:#1A1A1A;--dark2:#2C2C2C;--dark3:#3D3D3D;
  --text:#2C2C2C;--text-muted:#6B6B6B;
  --white:#FFFFFF;--red:#D64444;--green:#3DA84A;
  --radius:12px;--shadow:0 4px 24px rgba(0,0,0,0.10);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.16);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--beige);color:var(--text);min-height:100vh}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em}
/* ── LAYOUT ── */
#app{min-height:100vh;display:flex;flex-direction:column}
.top-bar{background:var(--dark);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-bar img.logo{height:36px}
.top-bar .mode-badge{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold-light);background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);border-radius:20px;padding:4px 12px}
.top-bar .back-btn{color:var(--gold-light);background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
/* ── SPLASH ── */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--dark);padding:40px 20px;gap:32px}
#splash img{width:220px;filter:drop-shadow(0 8px 32px rgba(201,168,76,0.4))}
#splash h1{color:var(--white);font-size:clamp(24px,5vw,36px);text-align:center}
#splash p{color:rgba(255,255,255,0.6);text-align:center;font-size:15px}
.splash-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;width:100%;max-width:600px}
.splash-card{flex:1;min-width:220px;background:rgba(255,255,255,0.06);border:1px solid rgba(201,168,76,0.3);border-radius:var(--radius);padding:28px 24px;cursor:pointer;transition:all 0.2s;text-align:center}
.splash-card:hover{background:rgba(201,168,76,0.12);border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 32px rgba(201,168,76,0.2)}
.splash-card .icon{font-size:36px;margin-bottom:12px}
.splash-card h2{color:var(--white);font-size:18px;margin-bottom:6px}
.splash-card p{color:rgba(255,255,255,0.5);font-size:13px}
/* ── TABS ── */
.tabs{display:flex;background:var(--dark2);border-bottom:1px solid rgba(201,168,76,0.2);overflow-x:auto}
.tab-btn{padding:14px 20px;background:none;border:none;color:rgba(255,255,255,0.5);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.05em}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-btn:hover:not(.active){color:rgba(255,255,255,0.8)}
/* ── CONTENT ── */
.tab-content{display:none;padding:20px;max-width:1200px;margin:0 auto;width:100%}
.tab-content.active{display:block}
/* ── CARDS ── */
.card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card-gold{border-left:4px solid var(--gold)}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all 0.2s;text-decoration:none}
.btn-gold{background:var(--gold);color:var(--dark);}.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;border:2px solid var(--gold);color:var(--gold)}.btn-outline:hover{background:var(--gold);color:var(--dark)}
.btn-dark{background:var(--dark);color:var(--white)}.btn-dark:hover{background:var(--dark3)}
.btn-red{background:var(--red);color:var(--white)}.btn-red:hover{opacity:0.85}
.btn-green{background:var(--green);color:var(--white)}.btn-green:hover{opacity:0.85}
.btn-sm{padding:8px 16px;font-size:12px}
.btn-full{width:100%}
/* ── FORMS ── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;border:1.5px solid #E0D8C8;border-radius:8px;font-size:14px;background:var(--white);transition:border 0.2s;color:var(--text)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.15)}
.form-textarea{resize:vertical;min-height:80px}
.form-input[disabled],.form-input:disabled{background:#F5F5F5;color:var(--text-muted);cursor:not-allowed}
/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}
.badge-gold{background:rgba(201,168,76,0.15);color:var(--gold-dark);border:1px solid rgba(201,168,76,0.4)}
.badge-blue{background:#EBF4FB;color:#2A6D9E;border:1px solid #B8D9EF}
.badge-purple{background:#F3EBFB;color:#7B35B0;border:1px solid #D5B9F0}
.badge-green{background:#EBF8EE;color:#2A7D3A;border:1px solid #B0DFB8}
.badge-red{background:#FCEAEA;color:#B02A2A;border:1px solid #F0B0B0}
/* ── SPLIT LAYOUT ── */
.split-layout{display:flex;gap:20px;align-items:flex-start}
.split-left{width:300px;flex-shrink:0}
.split-right{flex:1;min-width:0}
@media(max-width:700px){.split-layout{flex-direction:column}.split-left{width:100%}}
/* ── COURSE LIST ITEM ── */
.course-item{background:var(--white);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.course-item:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.course-item.selected{border-color:var(--gold);background:rgba(201,168,76,0.06)}
.course-item-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px}
.course-item-site{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.course-site-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.course-item-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.course-item-meta{font-size:12px;color:var(--text-muted)}
/* ── SLOT CHIPS ── */
.slot-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slot-chip{padding:8px 14px;border-radius:8px;border:2px solid #E0D8C8;background:var(--beige);cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s}
.slot-chip:hover{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.slot-chip.selected{border-color:var(--gold);background:var(--gold);color:var(--dark)}
.slot-chip.full{border-color:#E0D8C8;color:var(--text-muted);cursor:not-allowed;opacity:0.5}
/* ── LEVEL SELECTOR ── */
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.level-btn{padding:8px 4px;border-radius:8px;border:2px solid #E0D8C8;background:var(--beige);cursor:pointer;text-align:center;transition:all 0.2s;font-size:11px;font-weight:600}
.level-btn:hover{border-color:var(--gold)}
.level-btn.selected{border-color:var(--gold);background:var(--gold);color:var(--dark)}
.level-btn .level-num{font-size:18px;font-weight:800;display:block}
/* ── PAYMENT ── */
.pay-methods{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pay-method{border:2px solid #E0D8C8;border-radius:10px;padding:14px;cursor:pointer;transition:all 0.2s}
.pay-method:hover{border-color:var(--gold);background:rgba(201,168,76,0.04)}
.pay-method.selected{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.pay-method-header{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.pay-method-desc{font-size:12px;color:var(--text-muted);margin-top:4px;margin-left:30px}
.pay-radio{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-head{text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);padding:6px 0;text-transform:uppercase}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;border:2px solid transparent;transition:all 0.2s}
.cal-day:hover:not(.empty):not(.past){border-color:var(--gold);background:rgba(201,168,76,0.1)}
.cal-day.today{background:rgba(201,168,76,0.15);border-color:rgba(201,168,76,0.4)}
.cal-day.selected{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.cal-day.has-slot{position:relative}.cal-day.has-slot::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:var(--gold);border-radius:50%}
.cal-day.empty{cursor:default}.cal-day.past{color:var(--text-muted);cursor:not-allowed;opacity:0.4}
/* ── FILTERS ── */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filter-chip{padding:7px 14px;border-radius:20px;border:1.5px solid #E0D8C8;background:var(--white);cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s}
.filter-chip:hover{border-color:var(--gold)}
.filter-chip.active{border-color:var(--gold);background:var(--gold);color:var(--dark)}
/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;color:var(--dark)}
/* ── PIN ENTRY ── */
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--dark);padding:40px 20px;gap:24px}
.pin-screen h2{color:var(--white);font-size:22px}
.pin-dots{display:flex;gap:12px;margin:8px 0 20px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(201,168,76,0.5);background:transparent;transition:all 0.2s}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:220px}
.pin-key{padding:18px;border-radius:10px;background:rgba(255,255,255,0.08);border:none;color:var(--white);font-size:18px;font-weight:700;cursor:pointer;transition:all 0.2s}
.pin-key:hover{background:rgba(201,168,76,0.2)}
.pin-key.del{background:rgba(255,255,255,0.05);font-size:14px}
.pin-error{color:var(--red);font-size:13px;font-weight:600;min-height:18px}
/* ── COACH SLOTS ── */
.slot-row{background:var(--white);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-left:4px solid var(--gold)}
.slot-row-info{flex:1}
.slot-row-title{font-weight:700;font-size:15px}
.slot-row-meta{font-size:12px;color:var(--text-muted)}
/* ── BOOKING DETAIL ── */
.booking-row{background:var(--white);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.booking-info{font-size:14px;line-height:1.6}
.booking-info strong{color:var(--dark)}
/* ── TWINT QR ── */
.twint-qr-box{border:2px solid #E0D8C8;border-radius:12px;padding:16px;text-align:center;background:var(--beige)}
.twint-qr-box img{max-width:180px;border-radius:8px}
/* ── EBANKING ── */
.ebanking-box{background:var(--beige);border:2px solid rgba(201,168,76,0.3);border-radius:12px;padding:16px}
.ebanking-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(201,168,76,0.15);font-size:13px}
.ebanking-row:last-child{border-bottom:none}
.ebanking-row strong{color:var(--text-muted);font-size:12px}
.ebanking-iban{font-family:monospace;font-weight:700;color:var(--dark);font-size:14px}
/* ── CONFIRM ── */
.confirm-box{background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.05));border:2px solid rgba(201,168,76,0.4);border-radius:14px;padding:24px;text-align:center}
.confirm-check{font-size:48px;margin-bottom:12px}
.confirm-title{font-size:22px;font-weight:700;color:var(--dark);margin-bottom:8px}
.confirm-sub{font-size:14px;color:var(--text-muted);margin-bottom:20px}
/* ── ADMIN ── */
.admin-badge{background:linear-gradient(90deg,var(--gold-dark),var(--gold));color:var(--dark);padding:2px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:0.07em;text-transform:uppercase}
/* ── SETTINGS ── */
.settings-section{margin-bottom:28px}
.settings-section h3{font-size:15px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #E0D8C8}
/* ── UTILS ── */
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.text-sm{font-size:13px}.text-xs{font-size:11px}.text-muted{color:var(--text-muted)}
.text-gold{color:var(--gold)}.text-gold-dark{color:var(--gold-dark)}
.font-bold{font-weight:700}.font-black{font-weight:900}
.rounded{border-radius:8px}.w-full{width:100%}
.hidden{display:none!important}
.divider{height:1px;background:#E8E0D0;margin:16px 0}
.alert{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px}
.alert-success{background:#EBF8EE;color:#1E7A30;border:1px solid #B0DFB8}
.alert-error{background:#FCEAEA;color:#B02A2A;border:1px solid #F0B0B0}
.alert-info{background:#EBF4FB;color:#1E5480;border:1px solid #B0CDDF}
.twint-logo-img{width:80px;height:auto}
/* site colors */
.site-echandens{color:#C9A84C}.site-payerne{color:#4A9BC9}.site-saintmaurice{color:#9B4AC9}
.dot-echandens{background:#C9A84C}.dot-payerne{background:#4A9BC9}.dot-saintmaurice{background:#9B4AC9}
.type-ponctuel{color:#C9A84C}.type-module{color:#4A9BC9}.type-stage{color:#9B4AC9}
.splash-card-sm{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12)}
.splash-card-sm:hover{background:rgba(255,255,255,0.1)}
/* ── CALENDAR GRID ── */
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.cal-header-cell{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);padding:6px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{min-height:64px;background:var(--white);border-radius:8px;padding:6px;border:2px solid transparent;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;align-items:center}
.cal-cell:hover:not(.cal-empty){border-color:var(--gold);background:rgba(201,168,76,0.06)}
.cal-cell.cal-empty{background:transparent;cursor:default;min-height:0}
.cal-cell.cal-today{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.cal-cell.cal-past{opacity:0.45}
.cal-cell.cal-has-events{box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.cal-day-num{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px}
.cal-cell.cal-today .cal-day-num{color:var(--gold-dark)}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.cal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
@media(max-width:600px){.cal-cell{min-height:44px}.cal-day-num{font-size:11px}.cal-dot{width:6px;height:6px}}
</style>
</head>

// ─── PIN SCREEN ───
function renderPIN(){
  const entry = STATE.pinEntry || '';
  const dots = [0,1,2,3].map(i =>
    '<div class="pin-dot'+(i<entry.length?' filled':'')+'"></div>'
  ).join('');
  const keys = [1,2,3,4,5,6,7,8,9,'','0','⌫'].map(k =>
    k==='' ? '<div></div>' :
    '<button class="pin-key'+(k==='⌫'?' del':'')+'" onclick="pinKey(\''+k+'\')">'+k+'</button>'
  ).join('');
  return '<div class="pin-screen">' +
    '<img src="'+LOGO_B64+'" style="width:140px;margin-bottom:8px">' +
    '<h2>Espace Coach</h2>' +
    '<p style="color:rgba(255,255,255,0.5);font-size:13px">Entrez votre code PIN</p>' +
    '<div class="pin-dots">'+dots+'</div>' +
    '<div class="pin-pad">'+keys+'</div>' +
    '<div class="pin-error" id="pin-err"></div>' +
    '<button class="btn btn-outline mt-16" style="color:rgba(255,255,255,0.5);border-color:rgba(255,255,255,0.2)" onclick="STATE.mode=null;render()">← Retour</button>' +
  '</div>';
}

function pinKey(k){
  if(k==='⌫'){ STATE.pinEntry=(STATE.pinEntry||'').slice(0,-1); render(); return; }
  STATE.pinEntry=(STATE.pinEntry||'')+k;
  if(STATE.pinEntry.length===4){
    const pins=STATE.profPIN;
    if(STATE.pinEntry===pins.admin){ STATE.mode='coach'; STATE.profId='admin'; STATE.isAdmin=true; STATE.pinEntry=''; STATE.activeTab='home'; render(); return; }
    const p=PROFS.find(p=>pins[p.id]===STATE.pinEntry);
    if(p){ STATE.mode='coach'; STATE.profId=p.id; STATE.isAdmin=false; STATE.pinEntry=''; STATE.activeTab='home'; render(); return; }
    STATE.pinEntry='';
    render();
    const el=document.getElementById('pin-err');
    if(el) el.textContent='Code incorrect, réessayez.';
    return;
  }
  render();
}

// ─── CALENDRIER (all courses) ───
function buildAllCourses(){
  const siteFilter=STATE.activeSite||'all';
  const typeFilter=STATE.courseType||'all';
  let allCourses=[];
  STATE.slots.forEach(sl=>{
    allCourses.push({type:'ponctuel', id:'slot-'+sl.id, siteId:sl.site, name:sl.label||'Cours ponctuel', price:sl.price, meta:sl.date+' '+sl.time, duration:sl.duration, dateKey:sl.date, raw:sl});
  });
  MODULES.forEach(m=>{
    const s=siteById(m.site);
    const title='Module '+m.day+' ('+m.public+') – '+s.short;
    allCourses.push({type:'module', id:m.id, siteId:m.site, name:title, price:m.price, meta:m.period+' · '+m.sessions+' séances', dateKey:null, raw:m});
  });
  STAGES.forEach(st=>{
    allCourses.push({type:'stage', id:st.id, siteId:st.site, name:st.name, price:st.price, meta:st.dates+' · '+st.sessions+' jours', dateKey:null, raw:st});
  });
  if(siteFilter!=='all') allCourses=allCourses.filter(c=>c.siteId===siteFilter);
  if(typeFilter!=='all') allCourses=allCourses.filter(c=>c.type===typeFilter);
  return allCourses;
}

function renderCalGrid(allCourses,typeLabels,typeColors){
  const now=new Date();
  if(STATE.calYear===undefined){ STATE.calYear=now.getFullYear(); STATE.calMonth=now.getMonth(); }
  const yr=STATE.calYear; const mo=STATE.calMonth;
  const firstDay=new Date(yr,mo,1).getDay();
  const offset=(firstDay+6)%7;
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const monthNames=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const dayNames=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  const byDate={};
  allCourses.forEach(c=>{
    if(c.dateKey){ const k=c.dateKey; if(!byDate[k]) byDate[k]=[]; byDate[k].push(c); }
  });
  const moduleStage=allCourses.filter(c=>!c.dateKey);

  const todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  let cells='';
  for(let i=0;i<offset;i++) cells+='<div class="cal-cell cal-empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dk=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const items=byDate[dk]||[];
    const isToday=dk===todayStr;
    const isPast=dk<todayStr;
    const dots=items.slice(0,3).map(c=>'<div class="cal-dot" style="background:'+typeColors[c.type]+'" title="'+c.name+'"></div>').join('');
    const more=items.length>3?'<span style="font-size:9px;color:var(--text-muted)">+'+( items.length-3)+'</span>':'';
    cells+='<div class="cal-cell'+(isToday?' cal-today':'')+(isPast?' cal-past':'')+(items.length?' cal-has-events':'')+'" onclick="calDayClick(\''+dk+'\')">' +
      '<div class="cal-day-num">'+d+'</div>' +
      '<div class="cal-dots">'+dots+more+'</div>' +
    '</div>';
  }

  const header='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
    '<button class="btn btn-sm btn-outline" onclick="calNavMonth(-1)">← Préc.</button>' +
    '<strong style="font-size:16px">'+monthNames[mo]+' '+yr+'</strong>' +
    '<button class="btn btn-sm btn-outline" onclick="calNavMonth(1)">Suiv. →</button>' +
  '</div>';

  const dayRow=dayNames.map(d=>'<div class="cal-header-cell">'+d+'</div>').join('');

  let detail='';
  if(STATE.calDayKey){
    const selItems=byDate[STATE.calDayKey]||[];
    const typeLabels2={ponctuel:'Cours Ponctuel',module:'Module Collectif',stage:'Stage Vacances'};
    if(selItems.length>0){
      detail='<div class="card" style="margin-top:16px"><strong style="display:block;margin-bottom:12px">Cours du '+STATE.calDayKey+'</strong>'+
        selItems.map(c=>{
          const s=siteById(c.siteId);
          return '<div class="course-item" onclick="selectCourse(\''+c.id+'\',\''+c.type+'\');STATE.calView=\'list\';render()" style="margin-bottom:8px">' +
            '<div class="course-item-type" style="color:'+typeColors[c.type]+'">'+typeLabels2[c.type]+'</div>' +
            '<div class="course-item-name">'+c.name+'</div>' +
            '<div class="course-item-meta">'+c.meta+(c.price?'&nbsp;·&nbsp;CHF '+c.price:'')+'</div>' +
          '</div>';
        }).join('')+
      '</div>';
    } else {
      detail='<div class="card" style="margin-top:12px;padding:16px;text-align:center;color:var(--text-muted)">Aucun cours ponctuel ce jour.</div>';
    }
  }

  let moduleSect='';
  if(moduleStage.length>0){
    moduleSect='<div class="card card-gold" style="margin-top:16px"><strong style="display:block;margin-bottom:10px;font-size:14px">📦 Modules & stages (inscription continue)</strong>'+
      moduleStage.map(c=>{
        const s=siteById(c.siteId);
        return '<div class="course-item" onclick="selectCourse(\''+c.id+'\',\''+c.type+'\');STATE.calView=\'list\';render()" style="margin-bottom:8px">' +
          '<div class="course-item-type" style="color:'+typeColors[c.type]+'">'+typeLabels[c.type]+'</div>' +
          '<div class="course-item-site">'+siteDot(c.siteId)+'<span style="color:'+s.color+'">'+s.name+'</span></div>' +
          '<div class="course-item-name">'+c.name+'</div>' +
          '<div class="course-item-meta">'+c.meta+'</div>' +
        '</div>';
      }).join('')+
    '</div>';
  }

  return header +
    '<div class="cal-legend" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">' +
      '<span style="font-size:12px;color:var(--text-muted)">Légende :</span>' +
      '<span style="display:flex;align-items:center;gap:4px;font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block"></span> Cours ponctuel</span>' +
      '<span style="display:flex;align-items:center;gap:4px;font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:#4A9BC9;display:inline-block"></span> Module</span>' +
      '<span style="display:flex;align-items:center;gap:4px;font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:#9B4AC9;display:inline-block"></span> Stage</span>' +
    '</div>' +
    '<div class="cal-grid-header">'+dayRow+'</div>' +
    '<div class="cal-grid">'+cells+'</div>' +
    detail +
    moduleSect;
}

function calNavMonth(dir){
  if(STATE.calYear===undefined){ const now=new Date(); STATE.calYear=now.getFullYear(); STATE.calMonth=now.getMonth(); }
  STATE.calMonth+=dir;
  if(STATE.calMonth<0){ STATE.calMonth=11; STATE.calYear--; }
  if(STATE.calMonth>11){ STATE.calMonth=0; STATE.calYear++; }
  STATE.calDayKey=null;
  render();
}

function calDayClick(dk){
  STATE.calDayKey=(STATE.calDayKey===dk)?null:dk;
  render();
}

function selectCourse(id, type){
  STATE.selectedCourse=id; STATE.selectedSlot=null; STATE.selectedDate=null;
  STATE.currentCourseType=type;
  render();
}

function renderCourseDetail(){
  const id=STATE.selectedCourse;
  const type=STATE.currentCourseType;
  if(type==='ponctuel') return renderSlotDetail(id);
  if(type==='module') return renderModuleDetail(id);
  if(type==='stage') return renderStageDetail(id);
  return '';
}

  const s=siteById(sl.site);
  const prof=PROFS.find(p=>p.id===sl.profId)||{name:'Coach',avatar:'🎾'};

  return '<div class="card card-gold">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">' +
      '<div>' +

      '</div>' +
      '<div style="text-align:right"><div style="font-size:22px;font-weight:800;color:var(--gold-dark)">CHF '+sl.price+'</div><div class="text-xs text-muted">par personne</div></div>' +
    '</div>' +
    '<div class="flex gap-12 mb-12" style="flex-wrap:wrap">' +
      '<span>'+siteDot(sl.site)+'<strong style="color:'+s.color+'"> '+s.name+'</strong></span>' +
      '<span>📅 '+fmtDate(sl.date)+'</span>' +
      '<span>🕐 '+sl.time+'</span>' +
      '<span>⏱ '+sl.duration+'min</span>' +
      '<span>👤 '+prof.avatar+' '+prof.name+'</span>' +
      '<span style="color:'+(spots>0?'var(--green)':'var(--red)')+'">'+(spots>0?'✓ '+spots+' place(s)':'Complet')+'</span>' +

// ─── PAYMENT STEP ───
function renderBookingPay(bf){
  const type=bf.type; // ponctuel | module | stage
  const settings=STATE.settings;
  const hasStripe=settings.stripeDefault||settings.stripePonctuel||settings.stripeModule||settings.stripeStage;
  
  let methods=[];
  if(type==='ponctuel'){
    methods.push({id:'cash',label:'💵 Cash sur place',desc:'Payez directement au club le jour du cours'});
    methods.push({id:'twint',label:'TWINT',isTwint:true,desc:'Paiement mobile instantané'});
  } else {
    // module or stage
    methods.push({id:'twint',label:'TWINT',isTwint:true,desc:'Paiement mobile — précisez l\'heure de la transaction'});
    methods.push({id:'ebanking',label:'🏦 Virement bancaire',desc:'Virement via e-banking (E-Banking / TWINT)'});
    if(hasStripe){
      methods.push({id:'carte',label:'💳 Carte de crédit',desc:'Paiement sécurisé en ligne'});
    }
  }

  const methodHtml=methods.map(m=>{
    const sel=STATE.bfPayMethod===m.id;
    return '<div class="pay-method'+(sel?' selected':'')+'" onclick="STATE.bfPayMethod=\''+m.id+'\';updateModal(renderBookingModal())">' +
      '<div class="pay-method-header">' +
        '<input type="radio" class="pay-radio" '+(sel?'checked':'')+' name="paymethod">' +
        (m.isTwint?'<img src="'+TWINT_LOGO_B64+'" class="twint-logo-img" alt="TWINT">':m.label) +
      '</div>' +
      '<div class="pay-method-desc">'+m.desc+'</div>' +
    '</div>';
  }).join('');

  let payDetail='';
  if(STATE.bfPayMethod==='twint'){
    const qr=settings.twintQR;
    const num=settings.twintNumber;
    payDetail='<div class="twint-qr-box mt-12">' +
      (qr?'<img src="'+qr+'" alt="QR TWINT" style="max-width:180px;border-radius:8px"><br>':'') +
      (num?'<div class="mt-8 font-bold">'+num+'</div>':'') +
      '<div class="text-sm text-muted mt-4">Scannez le QR ou envoyez au numéro ci-dessus</div>' +
    '</div>' +
    ((type==='module'||type==='stage')?
      '<div class="form-group mt-12"><label class="form-label">⏰ Heure de votre transaction Twint *</label><input class="form-input" id="bf-twint-time" type="time" value="'+(STATE.bfTwintTime||'')+'"><div class="text-xs text-muted mt-4">Indiquez l\'heure exacte du paiement pour que nous puissions le vérifier</div></div>'
    :'');
  }
  if(STATE.bfPayMethod==='ebanking'){
    payDetail='<div class="ebanking-box mt-12">' +
      '<div class="form-label mb-8">Coordonnées bancaires :</div>' +
      '<div class="ebanking-row"><strong>Bénéficiaire</strong><span>GDN Entertainment Sàrl</span></div>' +
      '<div class="ebanking-row"><strong>Banque</strong><span>UBS 3963 Crans-Montana</span></div>' +
      '<div class="ebanking-row"><strong>IBAN</strong><span class="ebanking-iban">CH81 0026 8268 1344 6902 P</span></div>' +
      '<div class="alert alert-info mt-8 text-xs">Mentionnez votre nom + cours en référence du virement.</div>' +
    '</div>';
  }
  if(STATE.bfPayMethod==='carte'){
    const link=settings.stripePonctuel||settings.stripeModule||settings.stripeStage||settings.stripeDefault;
    payDetail='<div class="mt-12"><a href="'+link+'" target="_blank" class="btn btn-dark btn-full">Payer par carte de crédit →</a></div>';
  }

  // Get price
  let price='';
  if(bf.type==='ponctuel'){
    const sl=STATE.slots.find(s=>s.id===bf.id);
    if(sl) price='CHF '+sl.price;
  } else if(bf.type==='module'){
    const m=MODULES.find(x=>x.id===bf.id);
    if(m) price='CHF '+m.price;
  } else if(bf.type==='stage'){
    const st=STAGES.find(x=>x.id===bf.id);
    if(st) price='CHF '+st.price;
  }

  return '<div>' +
    '<h3 class="modal-title">Paiement</h3>' +
    (price?'<div style="background:linear-gradient(90deg,rgba(201,168,76,0.1),transparent);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between"><span class="font-bold">Montant total</span><span style="font-size:20px;font-weight:800;color:var(--gold-dark)">'+price+'</span></div>':'')+
    '<div class="form-label">Mode de paiement</div>' +
    '<div class="pay-methods">'+methodHtml+'</div>' +
    payDetail +
    '<div id="bf-pay-err" class="alert alert-error hidden mt-8"></div>' +
    '<div class="flex gap-8 mt-16">' +
      '<button class="btn btn-outline" onclick="STATE.bookingForm.step=\'info\';updateModal(renderBookingModal())">← Retour</button>' +
      '<button class="btn btn-gold" style="flex:1" onclick="submitBookingPay()">Confirmer l\'inscription</button>' +
    '</div>' +
  '</div>';
}

function submitBookingPay(){
  const errEl=document.getElementById('bf-pay-err');
  if(!STATE.bfPayMethod){ errEl.textContent='Veuillez choisir un mode de paiement.';errEl.classList.remove('hidden');return; }
  if(STATE.bfPayMethod==='twint' && (STATE.bookingForm.type==='module'||STATE.bookingForm.type==='stage')){
    const twintTime=document.getElementById('bf-twint-time')?.value;
    if(!twintTime){ errEl.textContent='Veuillez indiquer l\'heure de la transaction Twint.';errEl.classList.remove('hidden');return; }
    STATE.bfTwintTime=twintTime;
  }
  // Create booking
  const bf=STATE.bookingForm;
  const booking={
    id:uid(), type:bf.type, courseId:bf.id,
    slot:STATE.selectedSlot||'', date:STATE.selectedDate||'',
    name:STATE.bfName, email:STATE.bfEmail, phone:STATE.bfPhone||'',
    level:STATE.bfLevel, tennis:STATE.bfTennis||'non', tennisYears:STATE.bfTennisYears||'',
    comments:STATE.bfComments||'',
    payMethod:STATE.bfPayMethod, twintTime:STATE.bfTwintTime||'',
    createdAt:new Date().toISOString(), status:'pending'
  };
  STATE.bookings.push(booking); saveBookings();
  // Increment enrollment for ponctuel
  if(bf.type==='ponctuel'){
    const sl=STATE.slots.find(s=>s.id===bf.id);
    if(sl){ sl.enrolled=(sl.enrolled||0)+1; saveSlots(); }
  }
  STATE.bookingForm.step='confirm';
  STATE.lastBooking=booking;
  updateModal(renderBookingModal());
}

function addToICal(){
  const b=STATE.lastBooking; if(!b) return;
  let dateStr='';
  let dtStart=''; let dtEnd='';
  if(b.type==='ponctuel'){
    const sl=STATE.slots.find(s=>s.id===b.courseId);
    if(sl&&sl.date){
      const d=sl.date.replace(/-/g,'');
      const t=sl.time?sl.time.replace(':',''):'0900';
      dtStart=d+'T'+t+'00'; dtEnd=d+'T'+(parseInt(sl.time.replace(':',''))+100)+'00';
    }
  }
  if(!dtStart){ const now=new Date(); dtStart=now.toISOString().replace(/[-:\.]/g,'').slice(0,15); dtEnd=dtStart; }
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PadelOne//FR',
    'BEGIN:VEVENT','UID:'+b.id+'@padel-one.ch',
    'DTSTART:'+dtStart,'DTEND:'+dtEnd,
    'SUMMARY:Cours Padel One',
    'DESCRIPTION:Réservation Padel One Academy',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  a.download='padel-one-rdv.ics'; a.click();
}

function renderSlotFormModal(){
  const f=STATE.slotForm||{};
  const profOpts=PROFS.map(p=>'<option value="'+p.id+'"'+(f.profId===p.id?' selected':'')+'>'+p.name+'</option>').join('');
  const siteOpts=SITES.map(s=>'<option value="'+s.id+'"'+(f.site===s.id?' selected':'')+'>'+s.name+'</option>').join('');
  const isAdmin=STATE.isAdmin;

  // Duration options for price auto-fill
  const durOpts=[60,90].map(d=>'<option value="'+d+'"'+(f.duration==d?' selected':'')+'>'+d+' min</option>').join('');
  const studOpts=[1,2,3,4].map(n=>'<option value="'+n+'"'+(f.maxStudents==n?' selected':'')+'>'+n+'</option>').join('');

  return '<div>' +
    '<h3 class="modal-title">'+(f.editId?'Modifier le créneau':'Nouveau créneau ponctuel')+'</h3>' +
    '<div class="form-group"><label class="form-label">Site</label><select class="form-select" id="sf-site" onchange="updateSlotPrice()">'+siteOpts+'</select></div>' +
    (isAdmin?'<div class="form-group"><label class="form-label">Coach</label><select class="form-select" id="sf-prof">'+profOpts+'</select></div>':'')+
    '<div class="form-group"><label class="form-label">Intitulé</label><input class="form-input" id="sf-label" placeholder="Ex: Cours privé niveau 3-4" value="'+(f.label||'')+'"></div>' +
    '<div class="form-group"><label class="form-label">Date</label><input class="form-input" id="sf-date" type="date" value="'+(f.date||'')+'"></div>' +
    '<div class="form-group"><label class="form-label">Heure</label><input class="form-input" id="sf-time" type="time" value="'+(f.time||'')+'"></div>' +
    '<div class="form-group"><label class="form-label">Durée</label><select class="form-select" id="sf-duration" onchange="updateSlotPrice()">'+durOpts+'</select></div>' +
    '<div class="form-group"><label class="form-label">Nombre de joueurs max.</label><select class="form-select" id="sf-students" onchange="updateSlotPrice()">'+studOpts+'</select></div>' +
    '<div class="form-group"><label class="form-label">Prix (CHF)</label>' +
      '<input class="form-input" id="sf-price" type="number" value="'+(f.price||'')+'"'+(isAdmin?'':' readonly disabled')+'>' +
      '<div class="text-xs text-muted mt-4">'+(isAdmin?'Admin : modification libre.':'Prix automatique selon la grille tarifaire. Seul l\'admin peut modifier.')+'</div>' +
    '</div>' +
    '<div class="form-group"><label class="form-label">Niveau recommandé</label><input class="form-input" id="sf-level" placeholder="Ex: 3-5 ou Tous niveaux" value="'+(f.level||'')+'"></div>' +
    '<div id="sf-err" class="alert alert-error hidden"></div>' +
    '<div class="flex gap-8 mt-16">' +
      '<button class="btn btn-outline" onclick="closeModal()">Annuler</button>' +
      '<button class="btn btn-gold" style="flex:1" onclick="saveSlotForm()">Enregistrer</button>' +
    '</div>' +
  '</div>';
}

function updateSlotPrice(){
  const dur=parseInt(document.getElementById('sf-duration')?.value||'60');
  const students=parseInt(document.getElementById('sf-students')?.value||'1');
  const priceMap=PRICE_GRID[dur];
  if(!priceMap) return;
  const price=priceMap[students]||'';
  const el=document.getElementById('sf-price');
  if(el&&!STATE.isAdmin) el.value=price;
  else if(el&&STATE.isAdmin&&!el.value) el.value=price; // auto-fill for admin too if empty
}

function saveSlotForm(){
  const errEl=document.getElementById('sf-err');
  const label=document.getElementById('sf-label')?.value?.trim();
  const date=document.getElementById('sf-date')?.value;
  const time=document.getElementById('sf-time')?.value;
  const dur=parseInt(document.getElementById('sf-duration')?.value||'60');
  const maxS=parseInt(document.getElementById('sf-students')?.value||'1');
  const price=parseFloat(document.getElementById('sf-price')?.value||'0');
  const level=document.getElementById('sf-level')?.value?.trim()||'';
  const site=document.getElementById('sf-site')?.value;
  const profId=STATE.isAdmin?(document.getElementById('sf-prof')?.value||STATE.profId):STATE.profId;
  if(!label||!date||!time||!price){ errEl.textContent='Tous les champs obligatoires doivent être remplis.';errEl.classList.remove('hidden');return; }
  const f=STATE.slotForm;
  if(f.editId){
    const idx=STATE.slots.findIndex(s=>s.id===f.editId);
    if(idx>=0){ STATE.slots[idx]={...STATE.slots[idx],label,date,time,duration:dur,maxStudents:maxS,price,level,site,profId}; }
  } else {
    STATE.slots.push({ id:uid(),label,date,time,duration:dur,maxStudents:maxS,enrolled:0,price,level,site,profId });
  }
  saveSlots(); closeModal(); render();
}

// ─── COACH RESERVATIONS ───
function renderCoachReservations(){
  const isAdmin=STATE.isAdmin;
  const allBk=STATE.bookings;
  const visible=isAdmin?allBk:allBk.filter(b=>{
    if(b.type==='ponctuel'){
      const sl=STATE.slots.find(s=>s.id===b.courseId);
      return sl&&sl.profId===STATE.profId;
    }
    return false;
  });
  if(visible.length===0) return '<div class="card" style="padding:32px;text-align:center;color:var(--text-muted)">Aucune inscription reçue.</div>';
  return '<div><h2 style="margin-bottom:16px">Inscriptions reçues</h2>'+visible.map(b=>{
    let label='';
    if(b.type==='ponctuel'){ const sl=STATE.slots.find(s=>s.id===b.courseId); label=sl?sl.label+' '+fmtDate(sl.date):'Cours ponctuel'; }
    else if(b.type==='module'){ const m=MODULES.find(x=>x.id===b.courseId); label=m?'Module '+m.day+' '+siteById(m.site).name:'Module'; }
    else if(b.type==='stage'){ const st=STAGES.find(x=>x.id===b.courseId); label=st?st.name:'Stage'; }
    if(b.slot) label+=' '+b.slot;
    const pmLabels={cash:'Cash',twint:'Twint',ebanking:'Virement',carte:'Carte'};
    const bSt=b.status==='confirmed'?'badge-green':b.status==='cancelled'?'badge-red':'badge-gold';
    const bLbl=b.status==='confirmed'?'✓ Confirmé':b.status==='cancelled'?'✕ Annulé':'⏳ En attente';
    const bBorderColor=b.status==='confirmed'?'var(--green)':b.status==='cancelled'?'var(--red)':'var(--gold)';
    return '<div class="booking-row" style="border-left:3px solid '+bBorderColor+'">' +
      '<div class="flex justify-between mb-8 items-center">' +
        '<div><div class="font-bold">'+label+'</div><span class="badge '+bSt+'" style="font-size:11px;margin-top:4px;display:inline-block">'+bLbl+'</span></div>' +
        '<div class="flex gap-8">' +
          (b.status!=='confirmed'?'<button class="btn btn-green btn-sm" onclick="setBookingStatus(\''+b.id+'\',' +'\''+'confirmed'+'\''+')" style="font-size:12px">✓ Confirmer</button>':'')+
          (b.status!=='cancelled'?'<button class="btn btn-red btn-sm" onclick="setBookingStatus(\''+b.id+'\',' +'\''+'cancelled'+'\''+')" style="font-size:12px">✕ Annuler</button>':'')+
        '</div>' +
      '</div>' +
      '<div class="booking-info">' +
        '<div>👤 <strong>'+b.name+'</strong> · ✉ '+b.email+(b.phone?' · 📞 '+b.phone:'')+'</div>' +
        '<div>📊 Niveau: '+levelLabel(b.level)+' · 🎾 Tennis: '+(b.tennis==='oui'?'Oui'+(b.tennisYears?' ('+b.tennisYears+' ans)':''):'Non')+'</div>' +
        '<div>💳 '+pmLabels[b.payMethod]+(b.twintTime?' – Twint à '+b.twintTime:'')+'</div>' +
        (b.comments?'<div class="text-muted text-xs mt-4">💬 '+b.comments+'</div>':'')+
      '</div>' +
    '</div>';
  }).join('')+'</div>';
}

function setBookingStatus(id, status){
  const b=STATE.bookings.find(x=>x.id===id);
  if(b){ b.status=status; saveBookings(); render(); }
}

// ─── SETTINGS (admin only) ───
function renderProfSettings(){
  const s=STATE.settings;
  const hasStripe=s.stripeDefault||s.stripePonctuel||s.stripeModule||s.stripeStage;
  return '<div>' +
    '<h2 style="margin-bottom:20px">⚙️ Réglages</h2>' +
    '<div class="settings-section">' +
      '<h3>Carte de crédit (Stripe)</h3>' +
      '<div class="form-group"><label class="form-label">Lien Stripe – Défaut</label><input class="form-input" id="s-stripe-default" value="'+(s.stripeDefault||'')+'" placeholder="https://buy.stripe.com/..."></div>' +
      '<div class="form-group"><label class="form-label">Lien Stripe – Ponctuels</label><input class="form-input" id="s-stripe-ponctuel" value="'+(s.stripePonctuel||'')+'" placeholder="https://buy.stripe.com/..."></div>' +
      '<div class="form-group"><label class="form-label">Lien Stripe – Modules</label><input class="form-input" id="s-stripe-module" value="'+(s.stripeModule||'')+'" placeholder="https://buy.stripe.com/..."></div>' +
      '<div class="form-group"><label class="form-label">Lien Stripe – Stages</label><input class="form-input" id="s-stripe-stage" value="'+(s.stripeStage||'')+'" placeholder="https://buy.stripe.com/..."></div>' +
      (hasStripe?'<div class="alert alert-success">✓ Carte de crédit activée (lien Stripe configuré)</div>':'<div class="alert alert-info">Aucun lien Stripe configuré — la carte de crédit ne sera pas proposée comme moyen de paiement.</div>')+
    '</div>' +
    '<div class="settings-section">' +
      '<h3>Twint</h3>' +
      '<div class="form-group"><label class="form-label">Numéro Twint</label><input class="form-input" id="s-twint-num" value="'+(s.twintNumber||'')+'" placeholder="+41 79 000 00 00"></div>' +
      '<div class="form-group"><label class="form-label">QR Code Twint (image)</label>' +
        (s.twintQR?'<div class="twint-qr-box mb-8"><img src="'+s.twintQR+'" alt="QR Twint"></div>':'')+
        '<input type="file" accept="image/*" id="s-twint-qr" class="form-input" onchange="loadTwintQR(event)">' +
      '</div>' +
    '</div>' +
    '<div class="settings-section">' +
      '<h3>PINs Coachs</h3>' +
      PROFS.map(p=>'<div class="form-group"><label class="form-label">PIN '+p.name+'</label><input class="form-input" id="s-pin-'+p.id+'" type="password" value="'+(STATE.profPIN[p.id]||'')+'" maxlength="4" placeholder="4 chiffres"></div>').join('')+
      '<div class="form-group"><label class="form-label">PIN Admin</label><input class="form-input" id="s-pin-admin" type="password" value="'+(STATE.profPIN.admin||'')+'" maxlength="4" placeholder="4 chiffres"></div>' +
    '</div>' +
    '<button class="btn btn-gold" style="max-width:260px" onclick="saveSettings()">💾 Sauvegarder les réglages</button>' +
    '<div id="settings-msg" class="hidden mt-12"></div>' +
  '</div>';
}

function loadTwintQR(evt){
  const f=evt.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ STATE.settings.twintQR=e.target.result; saveSt(); render(); };
  r.readAsDataURL(f);
}

function saveSettings(){
  STATE.settings.stripeDefault=document.getElementById('s-stripe-default')?.value?.trim()||'';
  STATE.settings.stripePonctuel=document.getElementById('s-stripe-ponctuel')?.value?.trim()||'';
  STATE.settings.stripeModule=document.getElementById('s-stripe-module')?.value?.trim()||'';
  STATE.settings.stripeStage=document.getElementById('s-stripe-stage')?.value?.trim()||'';
  STATE.settings.twintNumber=document.getElementById('s-twint-num')?.value?.trim()||'';
  PROFS.forEach(p=>{
    const v=document.getElementById('s-pin-'+p.id)?.value?.trim();
    if(v&&v.length===4) STATE.profPIN[p.id]=v;
  });
  const adminPin=document.getElementById('s-pin-admin')?.value?.trim();
  if(adminPin&&adminPin.length===4) STATE.profPIN.admin=adminPin;
  saveSt();
  const msg=document.getElementById('settings-msg');
  if(msg){ msg.className='alert alert-success mt-12'; msg.textContent='✓ Réglages sauvegardés !'; }
}

// ─── MODAL UTILS ───
function showModal(html){
  let ov=document.getElementById('modal-overlay');
  if(!ov){ ov=document.createElement('div'); ov.id='modal-overlay'; ov.className='modal-overlay'; document.body.appendChild(ov); }
  ov.innerHTML='<div class="modal">'+html+'</div>';
  ov.style.display='flex';
  ov.onclick=function(e){ if(e.target===ov) closeModal(); };
}
function updateModal(html){
  const m=document.querySelector('#modal-overlay .modal');
  if(m) m.innerHTML=html;
}
function closeModal(){
  const ov=document.getElementById('modal-overlay');
  if(ov) ov.style.display='none';
}



// ─── COACH PROFILE (each coach can edit their own) ───
function renderCoachProfile(profId){
  STATE.editingCoachId=profId;
  const s=STATE.settings;
  if(!s.coachProfiles) s.coachProfiles={};
  const cp=s.coachProfiles[profId]||{};
  const prof=PROFS.find(p=>p.id===profId)||{name:'',specialty:'',role:''};
  return '<div class="settings-section">' +
    '<h3>Mon profil coach</h3>' +
    '<div class="form-group"><label class="form-label">Photo de profil</label>' +
      (cp.photo?'<div style="margin-bottom:8px"><img src="'+cp.photo+'" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)"></div>':'')+
      '<input type="file" id="coach-photo-input" accept="image/*" class="form-input" onchange="uploadCoachPhoto(this)" style="padding:4px">' +
    '</div>' +
    '<div class="form-group"><label class="form-label">Devise / Motto</label>' +
      '<input class="form-input" id="cp-motto" placeholder="Ex: Le padel, une passion qui se partage !" value="'+(cp.motto||'')+'"></div>' +
    '<div class="form-group"><label class="form-label">Spécialisation</label>' +
      '<input class="form-input" id="cp-specialty" placeholder="Ex: Cours collectifs adultes & perfectionnement" value="'+(cp.specialty||prof.specialty||'')+'"></div>' +
    '<button class="btn btn-gold" onclick="saveCoachProfile()">&#x1F4BE; Sauvegarder le profil</button>' +
    '<div id="cp-msg" class="mt-8"></div>' +
  '</div>';
}

function uploadCoachPhoto(input){
  const profId=STATE.editingCoachId;
  if(!profId) return;
  const file=input.files[0];
  if(!file) return;
  if(file.size>2*1024*1024){ alert('Image trop grande (max 2 Mo)'); return; }
  const reader=new FileReader();
  reader.onload=function(e){
    if(!STATE.settings.coachProfiles) STATE.settings.coachProfiles={};
    if(!STATE.settings.coachProfiles[profId]) STATE.settings.coachProfiles[profId]={};
    STATE.settings.coachProfiles[profId].photo=e.target.result;
    saveSt(); render();
  };
  reader.readAsDataURL(file);
}

function saveCoachProfile(){
  const profId=STATE.editingCoachId;
  if(!profId) return;
  if(!STATE.settings.coachProfiles) STATE.settings.coachProfiles={};
  if(!STATE.settings.coachProfiles[profId]) STATE.settings.coachProfiles[profId]={};
  const cp=STATE.settings.coachProfiles[profId];
  const motto=document.getElementById('cp-motto')?.value?.trim()||'';
  const specialty=document.getElementById('cp-specialty')?.value?.trim()||'';
  cp.motto=motto; cp.specialty=specialty;
  saveSt();
  const msg=document.getElementById('cp-msg');
  if(msg){ msg.className='alert alert-success'; msg.textContent='✓ Profil sauvegardé !'; }
}

// ─── LOOKUP RÉSERVATION (sans compte) ───
function renderLookup(){
  return '<div style="max-width:480px;margin:0 auto;padding:20px">' +
    '<button class="btn btn-outline mb-16" onclick="STATE.mode=null;render()">← Retour</button>' +
    '<div class="card card-gold mb-16">' +
      '<h2 style="margin-bottom:4px">🔍 Retrouver mes réservations</h2>' +
      '<p class="text-sm text-muted">Entrez votre email ou téléphone pour retrouver vos réservations.</p>' +
    '</div>' +
    '<div class="form-group"><label class="form-label">Email ou Téléphone</label>' +
      '<input class="form-input" id="lookup-q" placeholder="jean@example.com ou +41 79..." value="'+(STATE.lookupQ||'')+'"></div>' +
    '<button class="btn btn-gold btn-full mt-8" onclick="doLookup()">Rechercher</button>' +
    '<div id="lookup-results" style="margin-top:20px">' + (STATE.lookupResults||'') + '</div>' +
  '</div>';
}

function doLookup(){
  const q=(document.getElementById('lookup-q')?.value||'').trim().toLowerCase();
  STATE.lookupQ=q;
  if(!q){ document.getElementById('lookup-results').innerHTML='<div class="alert alert-error">Veuillez entrer un email ou téléphone.</div>'; return; }
  const bks=STATE.bookings.filter(b=>(b.email||'').toLowerCase()===q||(b.phone||'').replace(/\s/g,'')===q.replace(/\s/g,''));
  if(bks.length===0){ document.getElementById('lookup-results').innerHTML='<div class="alert alert-info">Aucune réservation trouvée pour cet identifiant.</div>'; return; }
  const pmLabels={cash:'Cash',twint:'Twint',ebanking:'Virement',carte:'Carte'};
  const html=bks.map(b=>{
    let label='';
    if(b.type==='ponctuel'){ const sl=STATE.slots.find(s=>s.id===b.courseId); label=sl?sl.label+' – '+fmtDate(sl.date)+' '+sl.time:'Cours ponctuel'; }
    else if(b.type==='module'){ const m=MODULES.find(x=>x.id===b.courseId); label=m?'Module '+m.day+' '+siteById(m.site).name:'Module'; }
    else if(b.type==='stage'){ const st=STAGES.find(x=>x.id===b.courseId); label=st?st.name:'Stage'; }
    if(b.slot) label+=' ('+b.slot+')';
    const stColor=b.status==='confirmed'?'badge-green':b.status==='cancelled'?'badge-red':'badge-gold';
    const stLabel=b.status==='confirmed'?'✓ Confirmé':b.status==='cancelled'?'✕ Annulé':'⏳ En attente';
    return '<div class="booking-row">' +
      '<div class="flex justify-between items-center mb-8">' +
        '<div class="font-bold">'+label+'</div>' +
        '<span class="badge '+stColor+'">'+stLabel+'</span>' +
      '</div>' +
      '<div class="booking-info">' +
        '<div>👤 '+b.name+' · 💳 '+pmLabels[b.payMethod]+(b.twintTime?' à '+b.twintTime:'')+'</div>' +
        '<div>📊 Niveau: '+levelLabel(b.level)+'</div>' +
        (b.calLink?'<div class="mt-8"><a href="'+b.calLink+'" target="_blank" class="btn btn-outline btn-sm">📅 Ajouter au calendrier</a></div>':'')+
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('lookup-results').innerHTML='<div><div class="font-bold mb-12">'+bks.length+' réservation(s) trouvée(s) :</div>'+html+'</div>';
}

// ─── INIT ───
render();
</script>
</body>
